<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #050810;
  color: #f1f5f9;
  font-family: 'Josefin Sans', system-ui, sans-serif;
  overflow: hidden;
}

/* ── Panel ── */
#ui {
  position: absolute;
  top: 16px;
  left: 16px;
  z-index: 10;
  width: 340px;
  max-height: 90vh;
  overflow-y: auto;
  background: rgba(5,8,16,0.88);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(245,158,11,0.15);
  border-radius: 12px;
  padding: 20px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.7), 0 0 0 1px rgba(245,158,11,0.06);
}
#ui::-webkit-scrollbar { width: 3px; }
#ui::-webkit-scrollbar-track { background: transparent; }
#ui::-webkit-scrollbar-thumb { background: rgba(245,158,11,0.3); border-radius: 2px; }

/* ── Panel Logo Header ── */
.panel-logo {
  margin-bottom: 14px;
  padding-bottom: 14px;
  border-bottom: 1px solid rgba(245,158,11,0.10);
}
.panel-logo-title {
  font-family: 'Cinzel', Georgia, serif;
  font-size: 0.85rem;
  font-weight: 600;
  letter-spacing: 0.15em;
  color: #f59e0b;
  line-height: 1.2;
}
.panel-logo-sub {
  font-family: 'Josefin Sans', sans-serif;
  font-size: 0.6rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: #64748b;
  margin-top: 3px;
}

/* ── Pill Buttons ── */
.btn-row {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-bottom: 10px;
}
.btn-row.mode-row { margin-bottom: 14px; }

button {
  font-family: 'Josefin Sans', sans-serif;
  font-size: 0.62rem;
  letter-spacing: 0.10em;
  text-transform: uppercase;
  padding: 5px 12px;
  border-radius: 99px;
  border: 1px solid rgba(148,163,184,0.18);
  background: transparent;
  color: #64748b;
  cursor: pointer;
  transition: all 0.2s ease;
  white-space: nowrap;
  touch-action: manipulation;
}
button:hover:not(.active) {
  border-color: rgba(245,158,11,0.4);
  color: #f59e0b;
}
button:focus-visible { outline: 2px solid #f59e0b; outline-offset: 2px; }
button.active {
  background: #f59e0b;
  border-color: #f59e0b;
  color: #050810;
  font-weight: 700;
}
button.mode-btn.active {
  background: #f59e0b;
  border-color: #f59e0b;
  color: #050810;
}

/* ── Legend ── */
.legend-sep {
  height: 1px;
  background: rgba(245,158,11,0.10);
  margin-bottom: 12px;
}
.legend {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  margin-bottom: 14px;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: 'Josefin Sans', sans-serif;
  font-size: 0.65rem;
  letter-spacing: 0.04em;
  color: #94a3b8;
}
.swatch {
  width: 10px;
  height: 10px;
  border-radius: 3px;
  flex-shrink: 0;
}

/* ── Notes ── */
#notes {
  background: rgba(245,158,11,0.04);
  border: 1px solid rgba(245,158,11,0.12);
  border-radius: 8px;
  padding: 12px;
  font-family: 'Josefin Sans', sans-serif;
  font-size: 0.72rem;
  line-height: 1.65;
  color: #cbd5e1;
}
#notes b { color: #f59e0b; font-weight: 600; }

/* ── Compass ── */
#compass {
  position: absolute;
  bottom: 20px;
  right: 20px;
  z-index: 10;
  background: rgba(5,8,16,0.85);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(245,158,11,0.15);
  border-radius: 10px;
  padding: 10px 16px;
  text-align: center;
  font-family: 'Josefin Sans', sans-serif;
  font-size: 0.6rem;
  letter-spacing: 0.12em;
  color: #f59e0b;
  line-height: 1.8;
  box-shadow: 0 8px 24px rgba(0,0,0,0.5);
}
#compass strong {
  font-family: 'Cinzel', serif;
  font-size: 0.62rem;
  font-weight: 600;
  display: block;
  margin-bottom: 4px;
  letter-spacing: 0.12em;
}

/* ── Hint tag ── */
.hint-tag {
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 5;
  font-family: 'Josefin Sans', sans-serif;
  font-size: 0.58rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: rgba(100,116,139,0.6);
  pointer-events: none;
}

        { name: "Family Lounge\n15' x 14'-3\"", x: 12, z: 0, w: 15, d: 14.25, c: 0x3b82f6, h: 3.5 },
        { name: "Open Terrace\n15'-10\" x 23'-3\"", x: 27, z: -3, w: 15.83, d: 23.25, c: 0x10b981, h: 0.8 },
        { name: "6' Wide Passage", x: 12, z: 14.25, w: 15, d: 6, c: 0x475569, h: 1 },
        { name: "Lift\n5' x 5'", x: 12, z: 20.25, w: 5, d: 5, c: 0x475569, h: 4 },
        { name: "Store Room\n5'-2\" x 7'-10\"", x: 12, z: 25.25, w: 5.17, d: 7.83, c: 0x64748b, h: 3.5 },
        { name: "Staircase", x: 17.5, z: 20.25, w: 10.5, d: 12.8, c: 0x64748b, h: 3.5 },
        { name: "Covered Outdoor Seating\n10' x 13'-6\"", x: 28, z: 20.25, w: 10, d: 13.5, c: 0x64748b, h: 1.5 }
      ]
    }
  }
};

function makeLabel(text) {
  const canvas = document.createElement('canvas');
  canvas.width = 256; canvas.height = 128;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = 'rgba(5,8,16,0.90)';
  ctx.fillRect(4, 4, 248, 120);
  ctx.strokeStyle = '#f59e0b';
  ctx.lineWidth = 2;
  ctx.strokeRect(4, 4, 248, 120);
  ctx.fillStyle = '#f1f5f9';
  ctx.font = 'bold 18px "Josefin Sans", sans-serif';
  ctx.textAlign = 'center';
  const lines = text.split('\n');
  lines.forEach((l, i) => ctx.fillText(l, 128, 50 + i * 26));
  const tex = new THREE.CanvasTexture(canvas);
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false }));
  sprite.scale.set(6.2, 3.1, 1);
  return sprite;
}

function buildScene() {
  while(floorGroup.children.length > 0) floorGroup.remove(floorGroup.children[0]);
  const floorsToDraw = currentFloor === 'all' ? [0, 1, 2] : [currentFloor];

  floorsToDraw.forEach(fIdx => {
    const data = plans[currentMode][fIdx];
    const yBase = currentFloor === 'all' ? fIdx * 12 : 0;

    data.rooms.forEach(r => {
      const geo = new THREE.BoxGeometry(r.w - 0.15, r.h, r.d - 0.15);
      const mat = new THREE.MeshLambertMaterial({ color: r.c, transparent: true, opacity: 0.85 });
      const mesh = new THREE.Mesh(geo, mat);
      const cx = W_OFFSET + r.x + r.w / 2;
      const cz = L_OFFSET + r.z + r.d / 2;
      mesh.position.set(cx, yBase + r.h / 2, cz);
      floorGroup.add(mesh);

      const edges = new THREE.EdgesGeometry(geo);
      const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0xe2e8f0, opacity: 0.4, transparent: true }));
      line.position.copy(mesh.position);
      floorGroup.add(line);

      if (currentFloor !== 'all' || fIdx === 2) {
        const lbl = makeLabel(r.name);
        lbl.position.set(cx, yBase + r.h + 1.8, cz);
        floorGroup.add(lbl);
      }
    });
  });

  const noteFloor = currentFloor === 'all' ? 0 : currentFloor;
  document.getElementById('notes').innerHTML = plans[currentMode][noteFloor].note;
}

function setFloor(f) {
  currentFloor = f;
  ['0','1','2','all'].forEach(id => {
    const el = document.getElementById('btn-f' + id);
    if(el) el.classList.toggle('active', id == f);
  });
  buildScene();
  if (typeof gsap !== 'undefined') {
    gsap.from('#notes', { opacity: 0, y: 6, duration: 0.3, ease: 'power2.out' });
  }
}

function setMode(m) {
  currentMode = m;
  document.getElementById('btn-re').classList.toggle('active', m === 'reimagined');
  document.getElementById('btn-orig').classList.toggle('active', m === 'original');
  buildScene();
  if (typeof gsap !== 'undefined') {
    gsap.from('#notes', { opacity: 0, y: 6, duration: 0.3, ease: 'power2.out' });
  }
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

buildScene();
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>

<script>
// ── GSAP Loading & Entrance ───────────────────────────────────────────────────
const mm = gsap.matchMedia();
mm.add("(prefers-reduced-motion: no-preference)", () => {
  gsap.timeline()
    .to('#l-line',  { scaleX: 1, opacity: 1, duration: 0.6, ease: 'power2.inOut' })
    .to('#l-title', { opacity: 1, y: 0, duration: 0.55, ease: 'power3.out' }, '-=0.3')
    .to('#l-line2', { scaleX: 1, opacity: 1, duration: 0.5, ease: 'power2.inOut' }, '-=0.2')
    .to('#l-sub',   { opacity: 1, duration: 0.4 }, '-=0.1')
    .to('#loader',  { opacity: 0, duration: 0.55, delay: 0.5,
        onComplete: () => { document.getElementById('loader').style.display = 'none'; }
    });
  gsap.from('#ui',      { opacity: 0, x: -24, duration: 0.65, delay: 1.7, ease: 'power2.out' });
  gsap.from('#compass', { opacity: 0, y: 12,  duration: 0.5,  delay: 1.9, ease: 'power2.out' });
  gsap.from('.hint-tag',{ opacity: 0,         duration: 0.4,  delay: 2.1, ease: 'none' });
});
mm.add("(prefers-reduced-motion: reduce)", () => {
  document.getElementById('loader').style.display = 'none';
});
</script>
