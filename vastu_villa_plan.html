<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4BHK Villa - Triple-Checked Vastu Shastra Interactive Blueprint</title>
<style>
  :root {
    --bg: #0f172a; --panel: #1e293b; --text: #f8fafc; --muted: #94a3b8;
    --accent: #f59e0b; --warn: #ef4444; --good: #10b981; --border: #334155;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  header { padding: 12px 24px; background: var(--panel); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
  header h1 { font-size: 16px; font-weight: 700; color: var(--accent); letter-spacing: 0.5px; }
  .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .btn-group { display: flex; background: var(--bg); border-radius: 6px; padding: 3px; border: 1px solid var(--border); }
  button { background: transparent; color: var(--muted); border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12.5px; font-weight: 600; transition: 0.2s; }
  button.active { background: var(--accent); color: #0f172a; }
  button.mode-orig.active { background: var(--warn); color: white; }
  button.mode-reim.active { background: var(--good); color: #0f172a; }
  .workspace { display: flex; flex: 1; overflow: hidden; }
  .canvas-area { flex: 1; display: flex; justify-content: center; align-items: center; position: relative; padding: 16px; background: radial-gradient(circle, #1e293b 1px, transparent 1px); background-size: 20px 20px; }
  svg { max-width: 100%; max-height: 100%; width: 660px; height: 660px; background: #090d16; border: 2px solid var(--border); border-radius: 8px; }
  .room { cursor: pointer; transition: 0.2s; stroke: #475569; stroke-width: 2; }
  .room:hover { filter: brightness(1.25); stroke: #fff; stroke-width: 2.5; }
  .room.selected { stroke: var(--accent); stroke-width: 3.5; }
  .room-label { fill: #f8fafc; font-size: 10.5px; font-weight: 700; text-anchor: middle; pointer-events: none; }
  .room-dim { fill: #cbd5e1; font-size: 9px; text-anchor: middle; pointer-events: none; }
  .vastu-tag { fill: #fbbf24; font-size: 8.5px; font-weight: 700; text-anchor: middle; pointer-events: none; }
  .dir-marker { position: absolute; background: rgba(15,23,42,0.9); border: 1px solid var(--accent); color: var(--accent); padding: 4px 10px; border-radius: 4px; font-size: 11px; font-weight: 700; pointer-events: none; }
  .dir-n { left: 24px; top: 50%; transform: translateY(-50%); }
  .dir-s { right: 24px; top: 50%; transform: translateY(-50%); }
  .dir-e { top: 20px; left: 50%; transform: translateX(-50%); }
  .dir-w { bottom: 20px; left: 50%; transform: translateX(-50%); }
  .sidebar { width: 400px; background: var(--panel); border-left: 1px solid var(--border); padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
  .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; margin-bottom: 6px; }
  .badge.orig { background: rgba(239,68,68,0.2); color: #fca5a5; border: 1px solid var(--warn); }
  .badge.reim { background: rgba(16,185,129,0.2); color: #6ee7b7; border: 1px solid var(--good); }
  .card { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 14px; }
  .card h3 { font-size: 12px; color: var(--accent); text-transform: uppercase; margin-bottom: 6px; letter-spacing: 0.5px; }
  .card p, .card li { font-size: 13px; line-height: 1.5; color: #e2e8f0; }
  .card ul { padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }

</head>

let curFloor = 'gf';
let curMode = 'orig';
let selectedId = null;

function updateCompassLabels() {
  if (compassMode === 'left') {
    document.getElementById('lblLeft').textContent = "◀ NORTH (N)";
    document.getElementById('lblTop').textContent = "▲ EAST (E)";
    document.getElementById('lblRight').textContent = "SOUTH (S) ▶";
    document.getElementById('lblBottom').textContent = "▼ WEST (W)";
  } else {
    document.getElementById('lblLeft').textContent = "◀ WEST (W)";
    document.getElementById('lblTop').textContent = "▲ NORTH (N)";
    document.getElementById('lblRight').textContent = "EAST (E) ▶";
    document.getElementById('lblBottom').textContent = "▼ SOUTH (S)";
  }
}

function render() {
  updateCompassLabels();
  const svg = document.getElementById('blueprint');
  svg.innerHTML = '';
  const rooms = DATA[curFloor][curMode];

  rooms.forEach((r, idx) => {
    const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
    const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    rect.setAttribute("x", r.x); rect.setAttribute("y", r.y);
    rect.setAttribute("width", r.w); rect.setAttribute("height", r.h);
    rect.setAttribute("fill", r.c);
    rect.setAttribute("class", "room" + (selectedId === r.id ? " selected" : ""));
    rect.onclick = () => selectRoom(r);
    g.appendChild(rect);

    const txt = document.createElementNS("http://www.w3.org/2000/svg", "text");
    txt.setAttribute("x", r.x + r.w / 2);
    txt.setAttribute("y", r.y + r.h / 2 - 8);
    txt.setAttribute("class", "room-label");
    txt.textContent = r.name;
    g.appendChild(txt);

    const dim = document.createElementNS("http://www.w3.org/2000/svg", "text");
    dim.setAttribute("x", r.x + r.w / 2);
    dim.setAttribute("y", r.y + r.h / 2 + 6);
    dim.setAttribute("class", "room-dim");
    dim.textContent = r.dim;
    g.appendChild(dim);

    const vtag = document.createElementNS("http://www.w3.org/2000/svg", "text");
    vtag.setAttribute("x", r.x + r.w / 2);
    vtag.setAttribute("y", r.y + r.h / 2 + 20);
    vtag.setAttribute("class", "vastu-tag");
    vtag.textContent = getZone(r.pos).split(" ")[0];
    g.appendChild(vtag);

    svg.appendChild(g);
    if (idx === 0 && !selectedId) selectRoom(r);
    else if (selectedId === r.id) updateSidebar(r);
  });
}

function updateSidebar(r) {
  const badge = document.getElementById('statusBadge');
  badge.className = "badge " + curMode;
  badge.textContent = curMode === 'orig' ? "ORIGINAL PLAN (VASTU AUDIT)" : "100% VASTU-REIMAGINED PLAN";
  document.getElementById('rTitle').textContent = r.name;
  document.getElementById('rDim').textContent = "Dimensions: " + r.dim;
  document.getElementById('rVastu').textContent = "Vastu Zone: " + getZone(r.pos);
  document.getElementById('rCritique').textContent = compassMode === 'left' ? r.critLeft : r.critTop;

  const ul = document.getElementById('rDesign');
  ul.innerHTML = '';
  r.design.forEach(item => {
    const li = document.createElement('li');
    li.textContent = item;
    ul.appendChild(li);
  });
}

function selectRoom(r) {
  selectedId = r.id;
  updateSidebar(r);
  render();
}

function setCompass(c) {
  compassMode = c;
  const btns = document.getElementById('compassBtns').children;
  btns[0].classList.toggle('active', c === 'left');
  btns[1].classList.toggle('active', c === 'top');
  render();
}

function setFloor(f) {
  curFloor = f; selectedId = null;
  const btns = document.getElementById('floorBtns').children;
  btns[0].classList.toggle('active', f === 'gf');
  btns[1].classList.toggle('active', f === 'ff');
  btns[2].classList.toggle('active', f === 'sf');
  render();
}

function setMode(m) {
  curMode = m; selectedId = null;
  const btns = document.getElementById('modeBtns').children;
  btns[0].classList.toggle('active', m === 'orig');
  btns[1].classList.toggle('active', m === 'reim');
  render();
}

render();
</script>
