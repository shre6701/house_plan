<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Villa Auro — Interior Walkthrough</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Josefin+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.185.0/examples/jsm/"}}
</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#050810;--surface:rgba(5,8,16,0.88);
  --border:rgba(245,158,11,0.18);--border-dim:rgba(245,158,11,0.10);
  --accent:#f59e0b;--text:#f1f5f9;--muted:#64748b;
  --font-head:'Cinzel',Georgia,serif;--font-body:'Josefin Sans',sans-serif;
}
body{background:#050810;margin:0;overflow:hidden;font-family:var(--font-body);color:var(--text)}
canvas{cursor:pointer;display:block}

#loader{position:fixed;inset:0;z-index:2000;background:#050810;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.ld-line{width:140px;height:1px;background:linear-gradient(90deg,transparent,#f59e0b,transparent);opacity:0;transform:scaleX(0);transform-origin:center}
.ld-brand{font-family:var(--font-head);font-size:2.2rem;font-weight:600;letter-spacing:.2em;color:#f59e0b;opacity:0;transform:translateY(20px)}
.ld-sub{font-family:var(--font-body);font-size:.7rem;letter-spacing:.28em;text-transform:uppercase;color:#64748b;opacity:0}

#hdr{position:fixed;top:0;left:0;right:0;height:52px;z-index:100;background:rgba(5,8,16,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border-dim);display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.logo{display:flex;flex-direction:column;gap:1px}
.logo-title{font-family:var(--font-head);font-size:.82rem;font-weight:600;letter-spacing:.15em;color:#f59e0b}
.logo-sub{font-size:.58rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.hdr-right{display:flex;align-items:center;gap:10px}
.mode-group{display:flex;gap:4px}
.mode-btn{font-family:var(--font-body);font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;border-radius:99px;padding:5px 14px;background:transparent;border:1px solid var(--border-dim);color:var(--muted);cursor:pointer;transition:all .22s ease;touch-action:manipulation;white-space:nowrap}
.mode-btn:hover:not(.active){border-color:var(--border);color:#f59e0b}
.mode-btn:focus-visible{outline:2px solid #f59e0b;outline-offset:2px}
.mode-btn.active{background:#f59e0b;color:#050810;font-weight:700}
#weather-badge{font-family:var(--font-body);font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap;padding:4px 12px;border-radius:99px;border:1px solid var(--border-dim)}
#breadcrumb{font-family:var(--font-body);font-size:.62rem;letter-spacing:.1em;color:#f59e0b;padding:5px 14px;border-radius:99px;border:1px solid var(--border-dim)}

#dock{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:100;display:flex;gap:4px;align-items:center;background:rgba(5,8,16,.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--border-dim);border-radius:99px;padding:6px 12px;flex-wrap:nowrap;overflow-x:auto;max-width:calc(100vw - 32px)}
#dock::-webkit-scrollbar{display:none}
.dock-btn{font-family:var(--font-body);font-size:.58rem;letter-spacing:.08em;text-transform:uppercase;border-radius:99px;padding:5px 11px;background:transparent;border:1px solid transparent;color:var(--muted);cursor:pointer;transition:all .2s ease;white-space:nowrap;touch-action:manipulation}
.dock-btn:hover:not(.active){border-color:var(--border);color:#f59e0b}
.dock-btn:focus-visible{outline:2px solid #f59e0b;outline-offset:2px}
.dock-btn.active{background:#f59e0b;color:#050810;font-weight:700}

#panel{position:fixed;right:0;top:52px;bottom:0;width:300px;background:rgba(5,8,16,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-left:1px solid var(--border-dim);padding:24px 20px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;z-index:100;transform:translateX(300px)}
#panel::-webkit-scrollbar{width:3px}
#panel::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.p-badge{font-family:var(--font-head);font-size:.58rem;letter-spacing:.2em;text-transform:uppercase;color:#f59e0b;margin-bottom:4px}
.p-name{font-family:var(--font-head);font-size:1.2rem;font-weight:600;letter-spacing:.06em;line-height:1.3}
.p-desc{font-size:.75rem;color:var(--muted);line-height:1.65;margin-top:2px}
.p-section-label{font-family:var(--font-head);font-size:.58rem;letter-spacing:.18em;text-transform:uppercase;color:#f59e0b;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.p-section-label::after{content:'';flex:1;height:1px;background:var(--border-dim)}
.p-card{background:rgba(245,158,11,.04);border:1px solid var(--border-dim);border-radius:8px;padding:12px}
.p-items-list{list-style:none;display:flex;flex-direction:column;gap:5px}
.p-items-list li{font-size:.72rem;color:#cbd5e1;padding-left:14px;position:relative;line-height:1.4}
.p-items-list li::before{content:'→';position:absolute;left:0;color:#f59e0b;font-size:.65rem}
.p-light-text{font-size:.72rem;color:#cbd5e1;line-height:1.55}
.p-sep{height:1px;background:var(--border-dim);margin:2px 0}
#back-btn{margin-top:auto;font-family:var(--font-body);font-size:.65rem;letter-spacing:.12em;text-transform:uppercase;padding:9px 18px;border-radius:99px;border:1px solid var(--border);color:#f59e0b;background:transparent;cursor:pointer;transition:all .2s ease;touch-action:manipulation;align-self:flex-start}
#back-btn:hover{background:rgba(245,158,11,.1)}
#back-btn:focus-visible{outline:2px solid #f59e0b;outline-offset:2px}

#hint{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(5,8,16,.75);backdrop-filter:blur(12px);border:1px solid var(--border-dim);border-radius:99px;padding:6px 18px;font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);z-index:99;pointer-events:none;transition:opacity .4s}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
</style>
</head>
<body>

<div id="loader" role="status" aria-label="Loading Villa Auro Interior">
  <div class="ld-line"></div>
  <div class="ld-brand">VILLA AURO</div>
  <div class="ld-line"></div>
  <div class="ld-sub">Interior · All 15 Rooms</div>
</div>

<header id="hdr">
  <div class="logo">
    <div class="logo-title">VILLA AURO</div>
    <div class="logo-sub">Interior Walkthrough · Ground Floor</div>
  </div>
  <div class="hdr-right">
    <div class="mode-group" role="group" aria-label="Time of day">
      <button class="mode-btn active" id="mode-day" onclick="window.setTimeMode('day')">☀ Day</button>
      <button class="mode-btn" id="mode-eve" onclick="window.setTimeMode('evening')">🌇 Evening</button>
    </div>
    <span id="weather-badge">☀ Daylight · Clear</span>
    <div id="breadcrumb">Overview</div>
  </div>
</header>

<div id="dock" role="navigation" aria-label="Room navigation">
  <button class="dock-btn active" id="db-overview" onclick="window.flyToOverview()">Overview</button>
  <button class="dock-btn" id="db-entrance"  onclick="window.flyToRoomById('entrance')">Entrance</button>
  <button class="dock-btn" id="db-living"    onclick="window.flyToRoomById('living')">Living</button>
  <button class="dock-btn" id="db-dining"    onclick="window.flyToRoomById('dining')">Dining</button>
  <button class="dock-btn" id="db-puja"      onclick="window.flyToRoomById('puja')">Puja</button>
  <button class="dock-btn" id="db-drawing"   onclick="window.flyToRoomById('drawing')">Drawing</button>
  <button class="dock-btn" id="db-bedroom"   onclick="window.flyToRoomById('bedroom')">Bedroom</button>
  <button class="dock-btn" id="db-kitchen"   onclick="window.flyToRoomById('kitchen')">Kitchen</button>
  <button class="dock-btn" id="db-staff"     onclick="window.flyToRoomById('staff')">Staff Room</button>
</div>

<aside id="panel" aria-label="Room details">
  <div class="p-badge" id="p-badge">Room</div>
  <h2 class="p-name" id="p-name">—</h2>
  <p class="p-desc" id="p-desc">—</p>
  <div class="p-sep"></div>
  <div class="p-card">
    <div class="p-section-label">Furnishings</div>
    <ul class="p-items-list" id="p-items"></ul>
  </div>
  <div class="p-card">
    <div class="p-section-label">Lighting</div>
    <p class="p-light-text" id="p-light">—</p>
  </div>
  <button id="back-btn" onclick="window.flyToOverview()" aria-label="Back to overview">← Back to Overview</button>
</aside>

<div id="hint">Click a room to explore · Drag to orbit</div>
<div id="model-toast" style="position:fixed;bottom:80px;right:24px;z-index:200;background:rgba(5,8,16,0.88);border:1px solid rgba(245,158,11,0.2);backdrop-filter:blur(16px);border-radius:8px;padding:10px 16px;font-family:'Josefin Sans',sans-serif;font-size:12px;color:rgba(255,255,255,0.6);display:flex;align-items:center;gap:8px;transition:opacity 0.4s;pointer-events:none;opacity:0;"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#f59e0b;animation:pulse 1s infinite;"></span>Loading 3D models…</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

/*
 * ─── FREE GLTF MODEL SOURCES ─────────────────────────────────────────────────
 *
 * CDN (loads automatically, no download):
 *   • SheenChair.glb — Three.js examples — Drawing Room chairs
 *
 * Download these from polyhaven.com → format: GLTF → resolution: 2K → extract ZIP:
 *
 *   polyhaven.com/sofa_03                → models/sofa_03/            (Living Room sofa)
 *   polyhaven.com/modern_coffee_table_01 → models/modern_coffee_table_01/ (Living Room table)
 *   polyhaven.com/dining_table           → models/dining_table/        (Dining table)
 *   polyhaven.com/dining_chair_02        → models/dining_chair_02/     (Dining chairs ×6)
 *   polyhaven.com/modern_arm_chair_01    → models/modern_arm_chair_01/ (Drawing armchairs)
 *   polyhaven.com/ClassicNightstand_01   → models/ClassicNightstand_01/ (Bedroom nightstands)
 *   polyhaven.com/bar_chair_round_01     → models/bar_chair_round_01/  (Kitchen bar stools)
 *
 * Each missing model falls back to the existing procedural geometry — safe to add one at a time.
 * ─────────────────────────────────────────────────────────────────────────────
 */

// ── Renderer ──────────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

// ── Scene ─────────────────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);
scene.fog = new THREE.FogExp2(0xB0D8F0, 0.003);

// ── GLTF / DRACO Loaders ──────────────────────────────────────────────────────
const dracoLoader = new DRACOLoader();
dracoLoader.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.185.0/examples/jsm/libs/draco/');
const gltfLoader = new GLTFLoader();
gltfLoader.setDRACOLoader(dracoLoader);

// ── Camera ────────────────────────────────────────────────────────────────────
const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.3, 300);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 2;
controls.maxDistance = 65;
controls.maxPolarAngle = Math.PI / 2;

// ── Global Lights ─────────────────────────────────────────────────────────────
const ambient = new THREE.AmbientLight(0xF0F8FF, 0.55);
scene.add(ambient);

const sun = new THREE.DirectionalLight(0xFFF9EE, 1.1);
sun.position.set(30, 40, 20);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 0.5; sun.shadow.camera.far = 150;
sun.shadow.camera.left = -45; sun.shadow.camera.right = 45;
sun.shadow.camera.top = 45; sun.shadow.camera.bottom = -45;
sun.shadow.bias = -0.001;
scene.add(sun);

const fill = new THREE.DirectionalLight(0xD4EEFF, 0.3);
fill.position.set(-20, 15, -15);
scene.add(fill);

// ── Room Lights (all defined before setTimeMode) ──────────────────────────────
const lampLiving = new THREE.PointLight(0xFFBB66, 0.5, 14, 2); lampLiving.position.set(-19, 6.5, -3.5);
const dine1      = new THREE.PointLight(0xFFCC66, 0.7, 10, 2); dine1.position.set(-2.5, 5.8, -10.37);
const dine2      = new THREE.PointLight(0xFFCC66, 0.7, 10, 2); dine2.position.set(-1.0, 5.8, -10.37);
const drawLight  = new THREE.PointLight(0xFFCC66, 0.6, 12, 2); drawLight.position.set(12.8, 6.5, -8.0);
const pujaLight  = new THREE.PointLight(0xFFAA22, 0.8,  8, 2); pujaLight.position.set(5.67, 5.0, -14.5);
const bLamp1     = new THREE.PointLight(0xFFAA66, 0.4,  9, 2); bLamp1.position.set(-18.5, 3.8, 1.5);
const bLamp2     = new THREE.PointLight(0xFFAA66, 0.4,  9, 2); bLamp2.position.set(-9.5, 3.8, 1.5);
const kitchLight = new THREE.PointLight(0xFFCC66, 0.6,  9, 2); kitchLight.position.set(15, 5.8, 1.5);
const staffLight = new THREE.PointLight(0xFFCC66, 0.5,  8, 2); staffLight.position.set(7.125, 5.0, 15.5);
[lampLiving, dine1, dine2, drawLight, pujaLight, bLamp1, bLamp2, kitchLight, staffLight].forEach(l => scene.add(l));

// ── Materials ─────────────────────────────────────────────────────────────────
const mats = {
  wall:    new THREE.MeshStandardMaterial({color:0xF2EDE4, roughness:0.88}),
  floor:   new THREE.MeshStandardMaterial({color:0x9B7D5A, roughness:0.72}),
  ceiling: new THREE.MeshStandardMaterial({color:0xFBF8F4, roughness:0.9}),
  sofa:    new THREE.MeshStandardMaterial({color:0x4A5568, roughness:0.88}),
  bed:     new THREE.MeshStandardMaterial({color:0xF5EFE6, roughness:0.95}),
  bedframe:new THREE.MeshStandardMaterial({color:0x2D1F0E, roughness:0.6, metalness:0.1}),
  wood:    new THREE.MeshStandardMaterial({color:0x6B4423, roughness:0.72}),
  metal:   new THREE.MeshStandardMaterial({color:0xC0A882, roughness:0.35, metalness:0.8}),
  glass:   new THREE.MeshStandardMaterial({color:0xB8D8F0, roughness:0.05, transparent:true, opacity:0.22}),
  rug:     new THREE.MeshStandardMaterial({color:0x7C3030, roughness:1.0}),
  pillow:  new THREE.MeshStandardMaterial({color:0xECE0D4, roughness:0.95}),
  lamp:    new THREE.MeshStandardMaterial({color:0xFFE8A0, roughness:0.25, emissive:new THREE.Color(0xFFCC44), emissiveIntensity:0.8}),
  marble:  new THREE.MeshStandardMaterial({color:0xF0EDE8, roughness:0.12, metalness:0.05}),
  dark:    new THREE.MeshStandardMaterial({color:0x111111, roughness:0.8}),
  tv:      new THREE.MeshStandardMaterial({color:0x0A0A0A, roughness:0.1, metalness:0.9}),
  tvscreen:new THREE.MeshStandardMaterial({color:0x001829, roughness:0.05, emissive:new THREE.Color(0x003050), emissiveIntensity:0.6}),
  curtain: new THREE.MeshStandardMaterial({color:0xE4D5B8, roughness:0.98, side:THREE.DoubleSide}),
  doormat: new THREE.MeshStandardMaterial({color:0x3A2D1E, roughness:1.0}),
  sanitary:new THREE.MeshStandardMaterial({color:0xF5F0EB, roughness:0.15, metalness:0.05}),
  tile:    new THREE.MeshStandardMaterial({color:0xE8E4DF, roughness:0.3}),
  puja:    new THREE.MeshStandardMaterial({color:0xCC8800, roughness:0.4, metalness:0.3}),
  steps:   new THREE.MeshStandardMaterial({color:0xD4C8B8, roughness:0.7}),
  liftMet: new THREE.MeshStandardMaterial({color:0x8A9BA8, roughness:0.2, metalness:0.9}),
  sunshaft:new THREE.MeshBasicMaterial({color:0xFFD880, transparent:true, opacity:0.04, side:THREE.DoubleSide, depthWrite:false}),
};

// ── Helpers ───────────────────────────────────────────────────────────────────
function box(w,h,d,mat){ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat); m.castShadow=true; m.receiveShadow=true; return m; }
function cyl(rt,rb,h,mat,s=16){ const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,s),mat); m.castShadow=true; m.receiveShadow=true; return m; }
function add(m,x,y,z){ m.position.set(x,y,z); scene.add(m); return m; }
function loadModelAt(url,{x,y,z,scale=1,rx=0,ry=0,rz=0,castShadow=true,receiveShadow=true}={}){
  return new Promise((resolve,reject)=>{
    gltfLoader.load(url,(gltf)=>{
      const model=gltf.scene;
      model.position.set(x,y,z);
      model.scale.setScalar(scale);
      model.rotation.set(rx,ry,rz);
      model.traverse(child=>{if(child.isMesh){child.castShadow=castShadow;child.receiveShadow=receiveShadow;}});
      scene.add(model);
      resolve(model);
    },undefined,(err)=>{console.warn('GLTF load failed:',url,err);reject(err);});
  });
}

// ── Floor & Ceiling ───────────────────────────────────────────────────────────
// Coordinate system: W_OFFSET=-20, L_OFFSET=-17.5, 1 unit=1 foot
// North=-Z, South=+Z, West=-X, East=+X
const floor = new THREE.Mesh(new THREE.PlaneGeometry(46,38), mats.floor);
floor.rotation.x=-Math.PI/2; floor.position.set(1,0,0); floor.receiveShadow=true;
scene.add(floor);
const ceil = new THREE.Mesh(new THREE.PlaneGeometry(46,38), mats.ceiling);
ceil.rotation.x=Math.PI/2; ceil.position.set(1,9,0);
scene.add(ceil);

// ── Perimeter Walls ───────────────────────────────────────────────────────────
const WBOT = 4.5;
// North wall z=-17.5
add(box(12,9,0.3,mats.wall),-14,WBOT,-17.5);
add(box(9,9,0.3,mats.wall),-2.5,WBOT,-17.5);
add(box(3.5,9,0.3,mats.wall),5.67,WBOT,-17.5);
add(box(9,9,0.3,mats.wall),13,WBOT,-17.5);
// North windows
add(box(4,2.2,0.12,mats.glass),-14,5.5,-17.4);
add(box(4,2.2,0.12,mats.glass),-1.83,5.5,-17.4);
add(box(3,2.2,0.12,mats.glass),12.8,5.5,-17.4);
// South wall z=+17.75
add(box(44,9,0.3,mats.wall),1,WBOT,17.75);
// West wall x=-20
add(box(0.3,9,38,mats.wall),-20,WBOT,0);
add(box(0.12,2.2,5,mats.glass),-19.9,5.5,-10.17);
add(box(0.12,2.2,5,mats.glass),-19.9,5.5,4.5);
// East wall x=22 (gap z≈-8.75 to -3.25 for entrance porch)
add(box(0.3,9,9.5,mats.wall),22,WBOT,-13.1);
add(box(0.3,9,21.5,mats.wall),22,WBOT,7.0);
add(box(0.12,2.2,5,mats.glass),21.9,5.5,4.75);

// ── Interior Walls ────────────────────────────────────────────────────────────
// N/S divider at z=-2.83 (south edge of north zone rooms)
add(box(12,9,0.3,mats.wall),-14,WBOT,-2.83);    // west: between Living & Bedroom
add(box(14,9,0.3,mats.wall),15,WBOT,-2.83);     // east: between Drawing/Entrance & Kitchen
// E/W walls between rooms
add(box(0.3,9,15,mats.wall),-7.33,WBOT,-10.17); // Living/Dining divider
add(box(0.3,9,5,mats.wall),3.67,WBOT,-15.0);    // Dining/Puja niche
add(box(0.3,9,15,mats.wall),7.67,WBOT,-10.17);  // Puja+Drawing/Entrance divider
add(box(0.3,9,21,mats.wall),-8,WBOT,7.5);       // Bedroom east / service west
add(box(0.3,9,5,mats.wall),-3,WBOT,3.5);        // Lift east wall
add(box(0.3,9,16.5,mats.wall),4.25,WBOT,9.25);  // Stair west / Powder east
add(box(0.3,9,12,mats.wall),10,WBOT,7.5);       // Stair east / Kitchen west
// Additional horizontal partitions
add(box(12,9,0.3,mats.wall),-14,WBOT,11.84);    // Bedroom south / Closet north
add(box(12,9,0.3,mats.wall),7.125,WBOT,13.25);  // Staff room north
add(box(7,9,0.3,mats.wall),16.5,WBOT,12.75);    // Pantry north

// ── 1. LIVING ROOM (NW) — cx=-13.67, cz=-10.17 ───────────────────────────────
add(box(6,0.65,1.4,mats.sofa),-17,0.325,-8.0);
add(box(6,0.8,0.32,mats.sofa),-17,1.05,-8.96);
add(box(0.32,1.05,1.72,mats.sofa),-19.86,0.525,-8.0);
add(box(1.4,0.65,4.0,mats.sofa),-14.5,0.325,-5.8);
add(box(0.32,0.8,4.0,mats.sofa),-15.3,1.05,-5.8);

function makeLabel(text) {
  const c=document.createElement('canvas'); c.width=288; c.height=72;
  const ctx=c.getContext('2d');
  ctx.clearRect(0,0,288,72);
  ctx.fillStyle='rgba(5,8,16,0.84)';
  if(ctx.roundRect){ctx.roundRect(4,4,280,64,10);ctx.fill();ctx.strokeStyle='rgba(245,158,11,0.55)';ctx.lineWidth=1.5;ctx.roundRect(4,4,280,64,10);ctx.stroke();}
  else{ctx.fillRect(4,4,280,64);ctx.fill();ctx.strokeStyle='rgba(245,158,11,0.55)';ctx.lineWidth=1.5;ctx.strokeRect(4,4,280,64);}
  ctx.fillStyle='#f59e0b';
  ctx.font='600 14px "Cinzel",Georgia,serif';
  ctx.textAlign='center';
  ctx.fillText(text,144,43);
  const tex=new THREE.CanvasTexture(c);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,depthTest:false}));
  sp.scale.set(5.8,1.45,1);
  return sp;
}

renderer.domElement.addEventListener('click',e=>{

  mouse.x=(e.clientX/window.innerWidth)*2-1;
  mouse.y=-(e.clientY/window.innerHeight)*2+1;

  const hits=raycaster.intersectObjects(triggerMeshes);

// ── Day / Evening Mode ────────────────────────────────────────────────────────
const _dayBg  =new THREE.Color(0x87CEEB);
const _eveBg  =new THREE.Color(0x1B1535);
const _dayFog =new THREE.Color(0xB0D8F0);
const _eveFog =new THREE.Color(0x1B1535);
const _dayAmb =new THREE.Color(0xF0F8FF);
const _eveAmb =new THREE.Color(0x0D1525);
const _daySun =new THREE.Color(0xFFF9EE);
const _eveSun =new THREE.Color(0xFFBB44);
const _dayFill=new THREE.Color(0xD4EEFF);
const _eveFill=new THREE.Color(0x050810);
let timeMode='day';

window.setTimeMode=function(mode){
  if(timeMode===mode)return;
  timeMode=mode;
  document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('mode-'+(mode==='day'?'day':'eve')).classList.add('active');
  const wb=document.getElementById('weather-badge');
  if(wb)wb.textContent=mode==='day'?'☀ Daylight · Clear':'🌇 Golden Hour · Dusk';
  const isEve=(mode==='evening');
  const bg =isEve?_eveBg :_dayBg;
  const fg =isEve?_eveFog:_dayFog;
  const amb=isEve?_eveAmb:_dayAmb;
  const sn =isEve?_eveSun:_daySun;
  const fl =isEve?_eveFill:_dayFill;
  gsap.to(scene.background,{r:bg.r,g:bg.g,b:bg.b,duration:1.6,ease:'power2.inOut'});
  gsap.to(scene.fog.color, {r:fg.r,g:fg.g,b:fg.b,duration:1.6,ease:'power2.inOut'});
  gsap.to(scene.fog,{density:isEve?0.007:0.003,duration:1.6,ease:'power2.inOut'});
  gsap.to(ambient.color,{r:amb.r,g:amb.g,b:amb.b,duration:1.6,ease:'power2.inOut'});
  gsap.to(ambient,{intensity:isEve?0.2:0.55,duration:1.6,ease:'power2.inOut'});
  gsap.to(sun.color,{r:sn.r,g:sn.g,b:sn.b,duration:1.6,ease:'power2.inOut'});
  gsap.to(sun,{intensity:isEve?0.15:1.1,duration:1.6,ease:'power2.inOut'});
  if(isEve)sun.position.set(40,2,-15); else sun.position.set(30,40,20);
  gsap.to(fill.color,{r:fl.r,g:fl.g,b:fl.b,duration:1.6,ease:'power2.inOut'});
  gsap.to(fill,{intensity:isEve?0.02:0.3,duration:1.6,ease:'power2.inOut'});
  gsap.to(lampLiving,{intensity:isEve?1.8:0.5, duration:1.6,ease:'power2.inOut'});
  gsap.to(dine1,     {intensity:isEve?2.5:0.7, duration:1.6,ease:'power2.inOut'});
  gsap.to(dine2,     {intensity:isEve?2.5:0.7, duration:1.6,ease:'power2.inOut'});
  gsap.to(drawLight, {intensity:isEve?2.0:0.6, duration:1.6,ease:'power2.inOut'});
  gsap.to(pujaLight, {intensity:isEve?2.5:0.8, duration:1.6,ease:'power2.inOut'});
  gsap.to(bLamp1,    {intensity:isEve?1.6:0.4, duration:1.6,ease:'power2.inOut'});
  gsap.to(bLamp2,    {intensity:isEve?1.6:0.4, duration:1.6,ease:'power2.inOut'});
  gsap.to(kitchLight,{intensity:isEve?2.0:0.6, duration:1.6,ease:'power2.inOut'});
  gsap.to(staffLight,{intensity:isEve?1.5:0.5, duration:1.6,ease:'power2.inOut'});
  gsap.to(renderer,{toneMappingExposure:isEve?0.9:1.0,duration:1.6,ease:'power2.inOut'});
  gsap.to(mats.sunshaft,{opacity:isEve?0.0:0.04,duration:1.0,ease:'power2.inOut',
    onComplete:()=>{shaft.visible=!isEve;bs.visible=!isEve;}});
  if(!isEve){shaft.visible=true;bs.visible=true;}
};

(()=>{

// ── Render Loop ───────────────────────────────────────────────────────────────
function animate(){
  requestAnimationFrame(animate);
  controls.update();
  const t=Date.now()*0.002;
  const lBase =timeMode==='evening'?1.3:0.7;
  const lPulse=timeMode==='evening'?0.22:0.1;
  mats.lamp.emissiveIntensity=lBase+lPulse*Math.sin(t);
  renderer.render(scene,camera);
}
animate();

window.addEventListener('resize',()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});
